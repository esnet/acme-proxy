changelog:
  exclude:
    labels:
      - ignore-for-release
  categories:
    - title: Breaking Changes
      labels:
        - breaking-change
    - title: New Features
      labels:
        - enhancement
        - feature
    - title: Bug Fixes
      labels:
        - bug
        - fix
    - title: Security
      labels:
        - security
    - title: Documentation
      labels:
        - documentation
        - docs
    - title: CI / Build
      labels:
        - cicd
        - build
        - chore
    - title: Dependencies
      labels:
        - dependencies
        - go-deps
    - title: Other Changes
      labels:
        - "*"
