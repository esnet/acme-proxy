# Shared defaults. Environment-specific overrides live in config/internal and config/public.
audience = 'global'
support_email = 'support@example.internal'
show_internal_notes = true

# Use the light palette for all readers.
BookTheme = 'light'

# Build the sidebar from the top-level content sections.
BookSection = '/'

BookRepo = 'https://github.com/esnet/acme-proxy'
BookLastChangeLink = '{{ .Site.Params.BookRepo }}/commit/{{ .GitInfo.Hash }}'
BookEditLink = '{{ .Site.Params.BookRepo }}/edit/main/docs/{{ .Path }}'
BookDateFormat = 'January 2, 2006'

BookSearch = true
BookComments = false
BookPortableLinks = 'warning'
BookServiceWorker = 'precache'
